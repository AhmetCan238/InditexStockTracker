name: ⚡ Super Fast Stock Checker

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  super-fast-stock-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write

    steps:
      - name: ⚡ Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            main_github.py
            scraperHelpers.py
            config.json
            requirements.txt
          sparse-checkout-cone-mode: false

      - name: ⚡ Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: ⚡ Chrome
        run: |
          google-chrome --version || sudo apt-get update && sudo apt-get install -y google-chrome-stable

      - name: ⚡ Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: ⚡ Fast Stock Check
        run: |
          echo "⚡ Super Fast Check - $(date '+%H:%M:%S')"
          timeout 360 python main_github.py || echo "⚠️ Timeout or completed"
        env:
          BOT_API: ${{ secrets.BOT_API }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          PYTHONUNBUFFERED: 1
          CHROME_NO_SANDBOX: 1
